name: Deploy to GitHub Pages

# Builds the static export and publishes it to GitHub Pages on every
# push. Nothing here is repo-specific: configure-pages reports the URL
# the site will actually be served from, and the build adapts to it — so
# this same workflow produces a correct site whether it runs in
# `kylekapoor.github.io` (served at the domain root) or in any other
# repo (served from /<repo-name>).
#
# The custom domain lives in `public/CNAME`, which Next copies verbatim
# into `out/`. It has to travel inside the artifact: a workflow deploy
# publishes whatever `out/` contains, so a CNAME that only existed in
# the repo root — or only in the Pages settings UI — can be dropped on
# the next deploy and take the domain down with it.

on:
  push:
    branches:
      - main
      - claude/kyle-portfolio-customization-iiqpgh
  # Lets the site be rebuilt from the Actions tab without a code change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. In-progress runs are allowed to finish rather
# than being cancelled, so a half-published site is never left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reads the URL the site will be served from, so the build can
      # prefix its assets correctly.
      #
      # This deliberately does NOT pass `enablement: true`. The workflow
      # token isn't allowed to create a Pages site ("Resource not
      # accessible by integration"), so asking it to try only turns a
      # settings step into a failed build. Pages has to be switched on by
      # hand once, in Settings → Pages, with Source set to **GitHub
      # Actions** — the "deploy from a branch" option runs the legacy
      # Jekyll builder against the repo source instead, which has no
      # index.html at its root and serves a 404.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # configure-pages reports the origin with whatever scheme Pages is
      # currently set to, and on a custom domain that stays `http://`
      # until "Enforce HTTPS" is ticked — which can't happen until the
      # certificate is issued. The first deploys after pointing a domain
      # land inside that window, so taking the output verbatim bakes
      # `http://kylekapoor.com` into og:url and the canonical link of a
      # site that only answers over TLS.
      #
      # This is a shell step because Actions expressions have no string
      # replace function — `${{ replace(...) }}` is not a syntax error
      # you find in review, it's a run that fails on start.
      - name: Force https on the site origin
        id: site
        env:
          ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          printf 'url=%s\n' "$(printf '%s' "$ORIGIN" | sed 's|^http://|https://|')" >> "$GITHUB_OUTPUT"

      - name: Build static export
        env:
          # base_path is "" for a user site (owner.github.io) and
          # "/repo-name" for a project site. lib/basePath.ts prefixes
          # every hand-written asset URL with it; next.config.ts hands it
          # to Next for the bundles and links.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Absolute origin for the canonical URL and the social card,
          # normalised to https by the step above.
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.url }}
        run: npm run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
