<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" role="img" aria-label="Sketch of a race circuit with sector markers">
  <defs>
    <linearGradient id="trkbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191521"/>
      <stop offset="100%" stop-color="#0f1016"/>
    </linearGradient>
  </defs>
  <rect width="320" height="400" fill="url(#trkbg)"/>

  <!-- circuit -->
  <path d="M74 322 C 40 292, 44 236, 82 220 C 122 204, 150 226, 178 208
           C 212 186, 200 138, 164 126 C 128 114, 96 132, 88 108
           C 78 78, 118 56, 158 62 C 214 70, 250 108, 254 158
           C 258 214, 224 250, 196 276 C 166 304, 122 356, 74 322 Z"
        fill="none" stroke="#c6cbd7" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
  <path d="M74 322 C 40 292, 44 236, 82 220 C 122 204, 150 226, 178 208
           C 212 186, 200 138, 164 126 C 128 114, 96 132, 88 108
           C 78 78, 118 56, 158 62 C 214 70, 250 108, 254 158
           C 258 214, 224 250, 196 276 C 166 304, 122 356, 74 322 Z"
        fill="none" stroke="#0f1016" stroke-width="2" stroke-dasharray="7 9" opacity="0.7"/>

  <!-- start/finish -->
  <g transform="rotate(-24 96 300)">
    <rect x="82" y="292" width="30" height="16" fill="#f4f5f8"/>
    <g fill="#0f1016">
      <rect x="82" y="292" width="7.5" height="8"/>
      <rect x="97" y="292" width="7.5" height="8"/>
      <rect x="89.5" y="300" width="7.5" height="8"/>
      <rect x="104.5" y="300" width="7.5" height="8"/>
    </g>
  </g>

  <!-- sector markers -->
  <circle cx="88" cy="108" r="5" fill="#ff5b5b"/>
  <circle cx="254" cy="158" r="5" fill="#ffd166"/>
  <circle cx="196" cy="276" r="5" fill="#7ee0a6"/>

  <text x="160" y="374" fill="#8c93a3" font-family="monospace" font-size="14" text-anchor="middle">S1 · S2 · S3</text>
</svg>
