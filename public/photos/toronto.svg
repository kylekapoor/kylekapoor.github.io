<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" role="img" aria-label="Sketch of the Toronto skyline at night with traffic light trails">
  <defs>
    <linearGradient id="tobg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131a2a"/>
      <stop offset="60%" stop-color="#10121c"/>
      <stop offset="100%" stop-color="#0d0e14"/>
    </linearGradient>
  </defs>
  <rect width="320" height="400" fill="url(#tobg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="44" cy="42" r="1.6" opacity="0.7"/>
    <circle cx="96" cy="26" r="1.2" opacity="0.5"/>
    <circle cx="238" cy="38" r="1.8" opacity="0.75"/>
    <circle cx="286" cy="72" r="1.3" opacity="0.55"/>
    <circle cx="160" cy="20" r="1.2" opacity="0.5"/>
  </g>

  <!-- skyline -->
  <g fill="#1d2434">
    <rect x="18" y="212" width="34" height="120"/>
    <rect x="58" y="180" width="28" height="152"/>
    <rect x="196" y="196" width="32" height="136"/>
    <rect x="234" y="228" width="26" height="104"/>
    <rect x="266" y="204" width="34" height="128"/>
  </g>
  <!-- CN-tower-ish spire, the one landmark that makes it read as Toronto -->
  <g fill="#232b3d">
    <rect x="142" y="150" width="14" height="182"/>
    <path d="M136 150 L162 150 L156 122 L142 122 Z"/>
    <ellipse cx="149" cy="122" rx="22" ry="11"/>
    <rect x="146" y="66" width="6" height="46"/>
  </g>
  <circle cx="149" cy="62" r="3" fill="#ff5b5b"/>

  <!-- lit windows -->
  <g fill="#ffd166" opacity="0.8">
    <rect x="24" y="224" width="5" height="7"/><rect x="36" y="240" width="5" height="7"/>
    <rect x="24" y="264" width="5" height="7"/><rect x="40" y="286" width="5" height="7"/>
    <rect x="64" y="196" width="5" height="7"/><rect x="76" y="216" width="5" height="7"/>
    <rect x="64" y="248" width="5" height="7"/><rect x="76" y="278" width="5" height="7"/>
    <rect x="202" y="212" width="5" height="7"/><rect x="216" y="238" width="5" height="7"/>
    <rect x="202" y="272" width="5" height="7"/>
    <rect x="240" y="244" width="5" height="7"/><rect x="248" y="276" width="5" height="7"/>
    <rect x="274" y="220" width="5" height="7"/><rect x="286" y="252" width="5" height="7"/>
    <rect x="274" y="288" width="5" height="7"/>
  </g>

  <!-- road + long-exposure traffic trails, the thing you actually watch -->
  <rect x="0" y="332" width="320" height="68" fill="#0b0c12"/>
  <g stroke-linecap="round">
    <path d="M4 350 L150 350" stroke="#ff5b5b" stroke-width="3.5" opacity="0.85"/>
    <path d="M168 350 L316 350" stroke="#ff5b5b" stroke-width="3.5" opacity="0.5"/>
    <path d="M8 372 L138 372" stroke="#ffd6a0" stroke-width="3.5" opacity="0.6"/>
    <path d="M158 372 L312 372" stroke="#ffd6a0" stroke-width="3.5" opacity="0.85"/>
  </g>
  <g stroke="#4f5666" stroke-width="2" stroke-dasharray="10 12">
    <line x1="0" y1="361" x2="320" y2="361"/>
  </g>
</svg>
