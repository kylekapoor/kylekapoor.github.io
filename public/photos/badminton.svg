<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" role="img" aria-label="Sketch of a badminton racket and shuttlecock">
  <defs>
    <linearGradient id="bdbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141c1a"/>
      <stop offset="100%" stop-color="#0f1016"/>
    </linearGradient>
  </defs>
  <rect width="320" height="400" fill="url(#bdbg)"/>

  <!-- racket, tilted -->
  <g transform="rotate(-28 150 210)">
    <ellipse cx="150" cy="150" rx="62" ry="82" fill="none" stroke="#c6cbd7" stroke-width="7"/>
    <!-- strings -->
    <g stroke="#c6cbd7" stroke-width="1.4" opacity="0.5">
      <line x1="112" y1="86" x2="112" y2="214"/>
      <line x1="131" y1="76" x2="131" y2="224"/>
      <line x1="150" y1="70" x2="150" y2="230"/>
      <line x1="169" y1="76" x2="169" y2="224"/>
      <line x1="188" y1="86" x2="188" y2="214"/>
      <line x1="92" y1="118" x2="208" y2="118"/>
      <line x1="88" y1="150" x2="212" y2="150"/>
      <line x1="92" y1="182" x2="208" y2="182"/>
    </g>
    <!-- throat + handle -->
    <path d="M132 226 L150 262 L168 226" fill="none" stroke="#c6cbd7" stroke-width="7" stroke-linejoin="round"/>
    <rect x="141" y="258" width="18" height="86" rx="9" fill="#7ee0a6" opacity="0.85"/>
    <g stroke="#0f1016" stroke-width="1.6" opacity="0.5">
      <line x1="141" y1="278" x2="159" y2="272"/>
      <line x1="141" y1="296" x2="159" y2="290"/>
      <line x1="141" y1="314" x2="159" y2="308"/>
    </g>
  </g>

  <!-- shuttlecock in flight, with a motion arc -->
  <path d="M228 96 C 250 128, 254 164, 240 196" fill="none" stroke="#5ad1ff" stroke-width="2" stroke-dasharray="4 7" opacity="0.7"/>
  <g transform="rotate(36 244 82)">
    <path d="M232 82 L256 82 L268 44 L220 44 Z" fill="#f4f5f8" opacity="0.92"/>
    <g stroke="#8c93a3" stroke-width="1.2">
      <line x1="240" y1="82" x2="232" y2="46"/>
      <line x1="248" y1="82" x2="256" y2="46"/>
    </g>
    <ellipse cx="244" cy="88" rx="12" ry="9" fill="#ff8a60"/>
  </g>
</svg>
