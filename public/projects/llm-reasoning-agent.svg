<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360" role="img" aria-label="Branching reasoning tree with one verified path selected">
  <defs>
    <linearGradient id="lrbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131a24"/>
      <stop offset="100%" stop-color="#0d0e14"/>
    </linearGradient>
  </defs>
  <rect width="400" height="360" fill="url(#lrbg)"/>
  <text x="36" y="42" fill="#f4f5f8" font-family="monospace" font-size="16">branch · verify · select</text>

  <!-- edges -->
  <g stroke="#39424f" stroke-width="1.8" fill="none">
    <path d="M64 180 C 100 180, 108 108, 148 108"/>
    <path d="M64 180 C 100 180, 108 252, 148 252"/>
    <path d="M148 108 C 190 108, 196 76, 236 76"/>
    <path d="M148 252 C 190 252, 196 220, 236 220"/>
    <path d="M148 252 C 190 252, 196 288, 236 288"/>
    <path d="M236 76 C 276 76, 284 128, 322 128"/>
    <path d="M236 288 C 276 288, 284 246, 322 246"/>
  </g>
  <!-- winning path -->
  <g stroke="#7ee0a6" stroke-width="2.6" fill="none">
    <path d="M64 180 C 100 180, 108 108, 148 108"/>
    <path d="M148 108 C 190 108, 196 160, 236 160"/>
    <path d="M236 160 C 276 160, 284 186, 322 186"/>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="64" cy="180" r="12" fill="#1c2531" stroke="#5ad1ff" stroke-width="2"/>
    <circle cx="148" cy="108" r="10" fill="#1b2a24" stroke="#7ee0a6" stroke-width="2"/>
    <circle cx="148" cy="252" r="10" fill="#1c2531" stroke="#4f5666" stroke-width="2"/>
    <circle cx="236" cy="76" r="9" fill="#1c2531" stroke="#4f5666" stroke-width="2"/>
    <circle cx="236" cy="160" r="10" fill="#1b2a24" stroke="#7ee0a6" stroke-width="2"/>
    <circle cx="236" cy="220" r="9" fill="#1c2531" stroke="#4f5666" stroke-width="2"/>
    <circle cx="236" cy="288" r="9" fill="#1c2531" stroke="#4f5666" stroke-width="2"/>
    <circle cx="322" cy="128" r="9" fill="#1c2531" stroke="#4f5666" stroke-width="2"/>
    <circle cx="322" cy="246" r="9" fill="#1c2531" stroke="#4f5666" stroke-width="2"/>
    <circle cx="322" cy="186" r="12" fill="#1b2a24" stroke="#7ee0a6" stroke-width="2.4"/>
  </g>

  <!-- pruned marks -->
  <g stroke="#ff8a60" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <path d="M318 124 l 8 8 M326 124 l -8 8"/>
    <path d="M318 242 l 8 8 M326 242 l -8 8"/>
  </g>

  <text x="322" y="216" fill="#7ee0a6" font-family="monospace" font-size="11" text-anchor="middle">✓</text>
  <g font-family="monospace" font-size="12" fill="#8c93a3">
    <text x="36" y="326">prompt</text>
    <text x="364" y="326" text-anchor="end">verified answer</text>
  </g>
</svg>
