<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360" role="img" aria-label="Streaming inference pipeline with a PSI drift threshold breach">
  <defs>
    <linearGradient id="dsbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101720"/>
      <stop offset="100%" stop-color="#0d0e14"/>
    </linearGradient>
  </defs>
  <rect width="400" height="360" fill="url(#dsbg)"/>

  <text x="40" y="42" fill="#f4f5f8" font-family="monospace" font-size="16">PSI drift monitor</text>

  <!-- pipeline stages -->
  <g font-family="monospace" font-size="11" fill="#c6cbd7">
    <rect x="34" y="62" width="76" height="32" rx="4" fill="#1a2230" stroke="#39424f"/>
    <text x="72" y="82" text-anchor="middle">stream</text>
    <rect x="128" y="62" width="76" height="32" rx="4" fill="#1a2230" stroke="#39424f"/>
    <text x="166" y="82" text-anchor="middle">infer</text>
    <rect x="222" y="62" width="76" height="32" rx="4" fill="#1a2230" stroke="#39424f"/>
    <text x="260" y="82" text-anchor="middle">score</text>
    <rect x="300" y="62" width="66" height="32" rx="4" fill="#2a1c1c" stroke="#7a3a3a"/>
    <text x="333" y="82" text-anchor="middle" fill="#ff8a8a">retrain</text>
  </g>
  <g stroke="#5ad1ff" stroke-width="1.6" opacity="0.75">
    <path d="M110 78 L126 78" marker-end=""/>
    <path d="M204 78 L220 78"/>
    <path d="M298 78 L299 78"/>
  </g>
  <g fill="#5ad1ff" opacity="0.85">
    <polygon points="126,78 120,74.5 120,81.5"/>
    <polygon points="220,78 214,74.5 214,81.5"/>
  </g>

  <!-- PSI series -->
  <g stroke="#2a2e3c" stroke-width="1">
    <line x1="40" y1="290" x2="366" y2="290"/>
    <line x1="40" y1="130" x2="40" y2="290"/>
  </g>
  <!-- threshold -->
  <line x1="40" y1="182" x2="366" y2="182" stroke="#ff8a60" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="366" y="176" fill="#ff8a60" font-family="monospace" font-size="11" text-anchor="end">PSI = 0.2</text>

  <path d="M48 268 L76 262 L104 270 L132 256 L160 262 L188 244 L216 250 L244 224 L272 196 L300 166 L328 148 L356 138"
        fill="none" stroke="#7ee0a6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- breach segment highlighted -->
  <path d="M272 196 L300 166 L328 148 L356 138" fill="none" stroke="#ff5b5b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="300" cy="166" r="5" fill="#ff5b5b"/>
  <circle cx="300" cy="166" r="11" fill="none" stroke="#ff5b5b" stroke-width="1.2" opacity="0.5"/>

  <text x="40" y="318" fill="#8c93a3" font-family="monospace" font-size="13">t →</text>
  <text x="366" y="318" fill="#8c93a3" font-family="monospace" font-size="13" text-anchor="end">auto-retrain fired</text>
</svg>
