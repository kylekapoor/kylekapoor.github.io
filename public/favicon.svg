<!-- Tab icon: "KK" in Caveat 500 on an ink disc — the same face at the
     same weight the cover draws "Kyle Kapoor" in (DrawnText, LandingPage).

     Baked to a path rather than set as <text>, because a favicon renders
     outside the page: it can't reach the site's webfont and would fall
     back to whatever cursive the OS happens to have, or to a serif.

     Concessions to 16px, where a tab actually shows it:
     · the disc runs full-bleed, so the ink fills the tile
     · the two K's are pushed apart by 130 units — at their natural
       advance the second sits inside the first one's overhang and the
       pair reads as one blot
     · the outline is stroked as well as filled, which thickens hairlines
       that otherwise antialias down to grey mush. Heavier cuts of Caveat
       were barely denser at this size; stroking the 500 is what reads. -->
